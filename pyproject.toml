[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcomsim"
version = "0.1.0"
description = "Task-centric, multi-fidelity simulation for agent communication networks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dwbj123" }]
keywords = ["agent communication", "discrete-event simulation", "ns-3", "pytorch", "6g"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "simpy>=4.1",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "typer>=0.12",
]

[project.optional-dependencies]
neural = ["torch>=2.2"]
web = ["streamlit>=1.36"]
all = ["torch>=2.2", "streamlit>=1.36"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "build>=1.2"]

[project.scripts]
agentcomsim = "agentcomsim.cli:app"

[tool.setuptools.packages.find]
include = ["agentcomsim*"]

[tool.setuptools.package-data]
agentcomsim = ["py.typed", "ns3/*.cc", "web/app.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"agentcomsim/web/app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["agentcomsim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
