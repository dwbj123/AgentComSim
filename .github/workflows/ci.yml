name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[all,dev]'
      - name: Format and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: pytest -q --cov=agentcomsim --cov-report=term
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel contents
        run: |
          python -m zipfile -l dist/agentcomsim-*.whl | grep 'agentcomsim/ns3/agentcomsim_bridge.cc'
          python -m zipfile -l dist/agentcomsim-*.whl | grep 'agentcomsim/web/app.py'
